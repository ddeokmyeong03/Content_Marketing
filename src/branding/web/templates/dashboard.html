<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>브랜딩 운영 대시보드</title>
<style>
  :root{
    --bg:#0A0A0A; --panel:#141414; --panel2:#1A1A1A; --line:#2a2a2a;
    --text:#F5F0E8; --muted:#8a857c; --accent:#F5F0E8; --good:#4ade80;
    --warn:#fbbf24; --bad:#f87171; --brand:#c9b8a0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Noto Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.5}
  header{padding:20px 28px;border-bottom:1px solid var(--line);display:flex;
    justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
  h1{font-size:18px;margin:0;letter-spacing:-0.02em}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .badge{background:var(--panel2);border:1px solid var(--line);border-radius:999px;
    padding:4px 12px;font-size:12px;color:var(--brand)}
  nav{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  nav button{background:none;border:none;color:var(--muted);padding:14px 16px;cursor:pointer;
    font-size:14px;border-bottom:2px solid transparent}
  nav button.active{color:var(--text);border-bottom-color:var(--brand)}
  main{padding:24px 28px;max-width:1100px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .tile .n{font-size:26px;font-weight:600;letter-spacing:-0.02em}
  .tile .l{color:var(--muted);font-size:12px;margin-top:4px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin-bottom:12px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--muted);font-weight:500}
  tr.clickable{cursor:pointer}
  tr.clickable:hover{background:var(--panel2)}
  .pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;border:1px solid var(--line)}
  .s-draft{color:var(--muted)} .s-approved{color:var(--good)} .s-published{color:#7dd3fc}
  .s-failed{color:var(--bad)} .s-rejected{color:var(--muted)} .s-review{color:var(--warn)}
  .rocket{color:var(--good)}
  button.act{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;margin-right:8px}
  button.act:hover{border-color:var(--brand)}
  button.approve{color:var(--good)} button.reject{color:var(--bad)}
  select{background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:7px 10px;font-size:13px}
  .muted{color:var(--muted)}
  .score{font-weight:600}
  .hi{color:var(--good)} .mid{color:var(--warn)} .lo{color:var(--bad)}
  .formula{color:var(--brand);font-size:13px}
  .drawer{position:fixed;top:0;right:0;width:min(460px,92vw);height:100%;background:var(--panel);
    border-left:1px solid var(--line);padding:24px;overflow-y:auto;transform:translateX(100%);
    transition:transform .2s;box-shadow:-20px 0 40px rgba(0,0,0,.4)}
  .drawer.open{transform:translateX(0)}
  .drawer h3{margin:0 0 4px} .drawer .cap{white-space:pre-wrap;background:var(--panel2);
    padding:12px;border-radius:8px;margin:10px 0;font-size:13px}
  .x{float:right;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
  .empty{color:var(--muted);padding:24px 0;text-align:center}
  .tag{color:var(--brand);font-size:12px;margin-right:6px}
  .bar{background:var(--panel2);border:1px solid var(--line);border-radius:999px;height:8px;
    margin-top:8px;overflow:hidden}
  .bar .fill{height:100%;background:var(--good);transition:width .3s;border-radius:999px}
  .chartcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  .chartcard h4{margin:0 0 2px;font-size:14px}
  svg circle{cursor:pointer}
</style>
</head>
<body>
<header>
  <div>
    <h1>브랜딩 운영 대시보드</h1>
    <div class="sub" id="brandline">불러오는 중…</div>
  </div>
  <div class="badge" id="metricbadge"></div>
</header>
<nav>
  <button data-tab="overview" class="active">개요</button>
  <button data-tab="queue">검토 큐</button>
  <button data-tab="comments">댓글 응대</button>
  <button data-tab="growth">성장 분석</button>
  <button data-tab="patterns">승리 공식</button>
  <button data-tab="control">설정·실행</button>
</nav>
<main id="view"></main>
<div class="drawer" id="drawer"></div>

<script>
const $ = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const view = document.getElementById('view');
const drawer = document.getElementById('drawer');
async function api(p){const r=await fetch('/api'+p);if(!r.ok)throw new Error(await r.text());return r.json();}
async function post(p){const r=await fetch('/api'+p,{method:'POST'});if(!r.ok)throw new Error(await r.text());return r.json();}
const scoreClass=(s)=> s==null?'':(s>=80?'hi':s>=70?'mid':'lo');

async function loadBrand(){
  try{const b=await api('/brand');
    document.getElementById('brandline').textContent = b.niche || b.profession || '';
    document.getElementById('metricbadge').textContent = b.primary_metric?('목표 지표: '+b.primary_metric+(b.auto_approve?' · 자동승인':'')):'';
  }catch(e){}
}

const tabs = {
  async overview(){
    const s = await api('/stats');
    let acc='';
    for(const [pf,v] of Object.entries(s.accounts||{})){
      const g=v.growth_30d; const gs=g==null?'—':(g>0?'+'+g:g);
      acc+=`<div class="tile"><div class="n">${v.followers.toLocaleString()}</div><div class="l">${pf} 팔로워 · 30일 ${gs}</div></div>`;
    }
    const c=s.counts;
    view.innerHTML=`
      <div class="grid">
        <div class="tile"><div class="n">${c.draft||0}</div><div class="l">검토 대기(draft)</div></div>
        <div class="tile"><div class="n">${c.approved||0}</div><div class="l">승인됨</div></div>
        <div class="tile"><div class="n">${c.published||0}</div><div class="l">발행됨</div></div>
        <div class="tile"><div class="n">${c.failed||0}</div><div class="l">실패</div></div>
        ${acc}
      </div>
      ${s.plan_theme?`<div class="card" style="margin-top:16px"><div class="muted">이번 주 테마</div><div style="font-size:16px;margin-top:4px">${s.plan_theme}</div></div>`:''}`;
  },
  async queue(){
    view.innerHTML=`<div class="card"><label class="muted">상태 </label>
      <select id="st">
        <option value="draft">draft</option><option value="approved">approved</option>
        <option value="published">published</option><option value="failed">failed</option>
        <option value="all">전체</option></select>
      <div id="qt" style="margin-top:12px"></div></div>`;
    const render=async()=>{
      const rows=await api('/queue?status='+document.getElementById('st').value);
      const qt=document.getElementById('qt');
      if(!rows.length){qt.innerHTML='<div class="empty">게시물이 없습니다.</div>';return;}
      qt.innerHTML=`<table><thead><tr><th>ID</th><th>플랫폼</th><th>기둥</th><th>주제</th><th>점수</th><th>상태</th></tr></thead><tbody>${
        rows.map(r=>`<tr class="clickable" data-id="${r.id}"><td>${r.id}</td><td>${r.platform}</td><td class="muted">${r.pillar}</td><td>${(r.topic||'').slice(0,40)}</td><td class="score ${scoreClass(r.engagement_score)}">${r.engagement_score??'—'}</td><td><span class="pill s-${r.status}">${r.status}</span></td></tr>`).join('')}</tbody></table>`;
      qt.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>openPost(tr.dataset.id));
    };
    document.getElementById('st').onchange=render; render();
  },
  async comments(){
    view.innerHTML=`<div class="card">
        <button class="act" onclick="runActInline('engage','📥 댓글 수집·초안 작성 중…','cres')">📥 댓글 수집 + 초안</button>
        <label class="muted" style="margin-left:10px">상태 </label>
        <select id="cst">
          <option value="drafted">초안 대기</option><option value="new">미처리</option>
          <option value="replied">응대 완료</option><option value="failed">실패</option>
          <option value="all">전체</option></select>
        <div id="cres" style="margin-top:10px"></div>
        <div class="muted" style="font-size:12px;margin-top:8px">빠른 답글 응대는 계정 활성도를 높여 알고리즘 도달을 늘립니다.</div>
        <div id="clist" style="margin-top:12px"></div>
      </div>`;
    const render=async()=>{
      const rows=await api('/comments?status='+document.getElementById('cst').value);
      const el=document.getElementById('clist');
      if(!rows.length){el.innerHTML='<div class="empty">해당 상태의 댓글이 없습니다.</div>';return;}
      el.innerHTML=rows.map(c=>`<div class="chartcard">
          <div><span class="tag">${c.platform}</span><b>@${c.author||'user'}</b>
            <span class="pill s-${c.status==='replied'?'published':'draft'}" style="float:right">${c.status}</span></div>
          <div style="margin:8px 0">${(c.text||'').replace(/</g,'&lt;')}</div>
          ${c.status!=='replied'?`<textarea id="r${c.id}" rows="2" style="width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px">${(c.draft_reply||'').replace(/</g,'&lt;')}</textarea>
            <div style="margin-top:6px"><button class="act approve" onclick="sendReply(${c.id})">답글 발행</button>
            <button class="act" onclick="ignoreC(${c.id})">무시</button></div>`
            :'<div class="muted" style="font-size:12px">응대 완료</div>'}
          ${c.error?`<div class="lo" style="font-size:12px;margin-top:4px">✗ ${c.error}</div>`:''}
        </div>`).join('');
    };
    document.getElementById('cst').onchange=render; render();
    window._renderComments=render;
  },
  async growth(){
    const [bo,at,igs,ths]=await Promise.all([
      api('/breakouts'),api('/attribution'),
      api('/growth-series?platform=instagram').catch(()=>({points:[]})),
      api('/growth-series?platform=threads').catch(()=>({points:[]}))]);
    let charts='';
    for(const [name,s] of [['instagram',igs],['threads',ths]]){
      if(s.points && s.points.length){
        charts+=`<div class="chartcard"><h4>${name} 팔로워 추이</h4>${lineChart(s.points,1040,140)}</div>`;
      }
    }
    const breaks=bo.filter(b=>b.is_breakout);
    let bhtml=breaks.length?`<table><thead><tr><th>점수</th><th></th><th>주제</th><th>이상치 지표</th></tr></thead><tbody>${
      breaks.map(b=>`<tr><td class="score hi">${b.score}</td><td class="rocket">🚀</td><td>${(b.topic||'').slice(0,40)}</td><td class="muted">${b.reasons.join(', ')}</td></tr>`).join('')}</tbody></table>`
      :'<div class="empty">탐지된 브레이크아웃이 없습니다. (성과 데이터 필요)</div>';
    let ahtml='';
    for(const g of at){
      const gs=g.follower_growth==null?'데이터 부족':'+'+g.follower_growth;
      ahtml+=`<div class="card"><b>${g.platform}</b> <span class="muted">· 30일 팔로워 ${gs}</span>`;
      if(g.follower_growth!=null){
        ahtml+=`<table style="margin-top:8px"><thead><tr><th>추정 유입</th><th>방식</th><th>주제</th></tr></thead><tbody>${
          g.rows.slice(0,8).map(r=>`<tr><td class="hi">${r.attributed}</td><td class="muted">${r.method}</td><td>${(r.topic||'').slice(0,38)}</td></tr>`).join('')}</tbody></table>`;
      }
      ahtml+='</div>';
    }
    view.innerHTML=`${charts}
      <div class="card"><h3 style="margin-top:0">🚀 브레이크아웃</h3>${bhtml}</div>
      <h3>성장 귀인 (이 글이 데려온 팔로워)</h3>${ahtml||'<div class="empty">계정 스냅샷 2개 이상 필요.</div>'}`;
  },
  async patterns(){
    const ps=await api('/patterns');
    if(!ps.length){view.innerHTML='<div class="empty">저장된 승리 공식이 없습니다.<br>insights deconstruct / external 로 축적하세요.</div>';return;}
    view.innerHTML=ps.map(p=>`<div class="card">
      <span class="tag">${p.source==='external'?'외부':'내부'}</span>
      <span class="pill">${p.hook_type||'-'}</span>
      <span class="muted" style="float:right">신뢰도 ${p.confidence}</span>
      <div style="margin-top:10px" class="formula">${p.replicable_formula||''}</div>
      <div class="muted" style="margin-top:6px">레버: ${(p.psychology_levers||[]).join(', ')}</div>
      ${p.spread_hypothesis?`<div class="muted" style="margin-top:4px">확산: ${p.spread_hypothesis}</div>`:''}
    </div>`).join('');
  },
  async control(){
    const cfg=await api('/config');
    const labels={anthropic_api_key:'Anthropic API 키',meta_access_token:'Meta/Threads 액세스 토큰',
      meta_app_secret:'Meta App Secret',meta_ig_user_id:'Instagram 사용자 ID',
      meta_threads_user_id:'Threads 사용자 ID',meta_app_id:'Meta App ID',notify_webhook_url:'알림 Webhook URL'};
    const rowsHtml=Object.entries(cfg).map(([k,v])=>{
      const cur=v.set?(v.secret?`<span class="hi">등록됨 (${v.masked})</span>`:`<span class="hi">${v.value}</span>`):'<span class="muted">미설정</span>';
      return `<div style="margin:8px 0">
        <div class="muted" style="font-size:12px">${labels[k]} — ${cur}</div>
        <input data-k="${k}" type="${v.secret?'password':'text'}" placeholder="${v.set?'변경하려면 입력':'값 입력'}"
          style="width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px;margin-top:3px"/>
      </div>`;
    }).join('');
    view.innerHTML=`
      <div class="card"><h3 style="margin-top:0">🩺 연결 진단</h3>
        <div class="muted" style="font-size:12px;margin-bottom:8px">키·토큰·계정 ID가 실제로 동작하는지 검사합니다. 사용자 ID가 틀렸으면 올바른 값을 찾아 고쳐줍니다.</div>
        <button class="act" onclick="runDiag(false)">진단 실행</button>
        <button class="act" onclick="runDiag(true)">진단 + 자동 수정</button>
        <div id="diagres" style="margin-top:12px"></div>
      </div>
      <div class="card"><h3 style="margin-top:0">수동 실행 (수집 → 분석 → 생성 → 발행)</h3>
        <button class="act" onclick="runAct('collect','📥 성과 수집 중…')">📥 성과 수집</button>
        <button class="act" onclick="runAct('analyze','🔍 브레이크아웃 역설계 중…')">🔍 분석(역설계)</button>
        <button class="act" onclick="runAct('generate','✨ 주간 콘텐츠 생성 중…')">✨ 콘텐츠 생성</button>
        <button class="act" onclick="runAct('publish-due','🚀 발행 중…')">🚀 예약 발행</button>
        <div id="actres" style="margin-top:12px"></div>
      </div>
      <div class="card"><h3 style="margin-top:0">API 키 · 설정</h3>
        <div class="muted" style="font-size:12px;margin-bottom:8px">값은 로컬 DB(settings_store)에 저장되어 .env보다 우선 적용됩니다. 빈 칸은 기존 값 유지.</div>
        ${rowsHtml}
        <button class="act" onclick="saveCfg()" style="margin-top:8px">저장</button>
        <span id="cfgres" class="muted" style="margin-left:10px"></span>
      </div>`;
  }
};

function lineChart(points,w,h){
  if(!points || points.length<2)
    return '<div class="muted">스냅샷이 2개 이상 쌓이면 추이가 표시됩니다.</div>';
  const vals=points.map(p=>p.followers), min=Math.min(...vals), max=Math.max(...vals);
  const pad=10, iw=w-pad*2, ih=h-pad*2;
  const X=i=>pad+iw*i/(points.length-1);
  const Y=v=>pad+ih*(1-(v-min)/((max-min)||1));
  const line=points.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.followers).toFixed(1)}`).join(' ');
  const area=`M${X(0).toFixed(1)},${(h-pad).toFixed(1)} `+points.map((p,i)=>`L${X(i).toFixed(1)},${Y(p.followers).toFixed(1)}`).join(' ')+` L${X(points.length-1).toFixed(1)},${(h-pad).toFixed(1)} Z`;
  const dots=points.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.followers).toFixed(1)}" r="3.5" fill="var(--good)"><title>${new Date(p.t).toLocaleDateString()} · ${p.followers.toLocaleString()} 팔로워</title></circle>`).join('');
  const d=new Date(points[0].t).toLocaleDateString(), d2=new Date(points[points.length-1].t).toLocaleDateString();
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
      <path d="${area}" fill="var(--good)" opacity="0.08"/>
      <path d="${line}" fill="none" stroke="var(--good)" stroke-width="2" stroke-linejoin="round"/>${dots}
    </svg>
    <div class="muted" style="font-size:12px">${d} → ${d2} · ${min.toLocaleString()} ~ ${max.toLocaleString()} 팔로워</div>`;
}

async function sendReply(id){
  const ta=document.getElementById('r'+id);
  const r=await fetch('/api/comments/'+id+'/reply',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({message:ta.value})});
  const j=await r.json();
  if(j.ok){ if(window._renderComments) window._renderComments(); }
  else alert('실패: '+j.error);
}
async function ignoreC(id){
  await post('/comments/'+id+'/ignore');
  if(window._renderComments) window._renderComments();
}
async function runActInline(name,busy,targetId){
  const el=document.getElementById(targetId);
  el.innerHTML=`<div class="muted">${busy}</div><div class="bar"><div class="fill" style="width:5%"></div></div>`;
  try{
    const {job_id}=await post('/actions/'+name);
    pollJob(job_id, el, ()=>{ if(window._renderComments) window._renderComments(); });
  }catch(e){el.innerHTML=`<span class="lo">✗ ${e.message}</span>`;}
}
window.sendReply=sendReply; window.ignoreC=ignoreC; window.runActInline=runActInline;

async function runDiag(fix){
  const el=document.getElementById('diagres');
  el.innerHTML='<span class="muted">진단 중…</span>';
  try{
    const r=await post('/diagnostics'+(fix?'?autofix=true':''));
    const icon={ok:'<span class="hi">✓</span>',warn:'<span class="mid">⚠</span>',
                fail:'<span class="lo">✗</span>',skip:'<span class="muted">—</span>'};
    el.innerHTML=r.checks.map(c=>`<div style="margin:6px 0">
        ${icon[c.status]||'•'} <b>${c.name}</b> — ${c.message}
        ${c.hint&&(c.status==='warn'||c.status==='fail')?`<div class="muted" style="font-size:12px;margin-left:18px">→ ${c.hint}</div>`:''}
      </div>`).join('')
      + (r.ok?'<div class="hi" style="margin-top:8px">모든 검사 통과 — 생성·발행 준비 완료.</div>':'');
    if(fix) loadBrand();
  }catch(e){el.innerHTML=`<span class="lo">✗ ${e.message}</span>`;}
}
window.runDiag=runDiag;

async function runAct(name,busy){
  const el=document.getElementById('actres');
  el.innerHTML=`<div class="muted">${busy}</div><div class="bar"><div class="fill" style="width:5%"></div></div>`;
  try{
    const {job_id}=await post('/actions/'+name);
    pollJob(job_id, el);
  }catch(e){el.innerHTML=`<span class="lo">✗ ${e.message}</span>`;}
}
async function pollJob(id, el, onDone){
  try{
    const j=await api('/jobs/'+id);
    const pct=Math.round((j.progress||0)*100);
    if(j.status==='running'){
      el.innerHTML=`<div class="muted">${j.message||'실행 중…'} (${pct}%)</div><div class="bar"><div class="fill" style="width:${Math.max(pct,5)}%"></div></div>`;
      setTimeout(()=>pollJob(id,el,onDone),1200);
    }else if(j.status==='done'){
      el.innerHTML=`<span class="hi">✓ ${(j.result&&j.result.message)||'완료'}</span>`;
      if(onDone) onDone();
    }else{
      el.innerHTML=`<span class="lo">✗ ${j.error}</span>`;
    }
  }catch(e){el.innerHTML=`<span class="lo">✗ ${e.message}</span>`;}
}
async function saveCfg(){
  const payload={};
  document.querySelectorAll('#view input[data-k]').forEach(i=>{if(i.value.trim())payload[i.dataset.k]=i.value.trim();});
  const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const j=await r.json();
  document.getElementById('cfgres').innerHTML=`<span class="hi">저장됨 (${(j.changed||[]).length}개)</span>`;
  tabs.control();
}
window.runAct=runAct; window.saveCfg=saveCfg;

const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 캐러셀은 캡션이 아니라 '카드에 인쇄되는 문구'를 봐야 검토가 된다.
function slidesHtml(p){
  const slides=p.slides||[];
  if(!slides.length) return '';
  const missing=p.slides_missing_images||[];
  const warn=missing.length
    ? `<div class="muted" style="color:#e0a030;margin:6px 0">⚠ 이미지가 없는 슬라이드: ${missing.join(', ')} —
       발행하려면 render → upload 가 필요합니다.</div>`
    : `<div class="muted" style="color:#4ea72e;margin:6px 0">✓ 모든 슬라이드 업로드 완료 — 발행 가능</div>`;
  const cards=slides.map(s=>{
    const state=s.uploaded?'<span style="color:#4ea72e">업로드됨</span>'
      :s.rendered?'<span style="color:#e0a030">렌더됨</span>'
      :'<span style="color:#c0504d">미렌더</span>';
    const thumb=s.rendered
      ? `<a href="/api/posts/${p.id}/slides/${s.index}/preview" target="_blank" title="크게 보기">
           <img src="/api/posts/${p.id}/slides/${s.index}/preview" alt="슬라이드 ${s.index}"
             style="width:104px;height:130px;object-fit:cover;border-radius:6px;flex:none;background:#111"></a>`
      : `<div style="width:104px;height:130px;border-radius:6px;flex:none;background:#1a1a1a;
             display:flex;align-items:center;justify-content:center" class="muted">미렌더</div>`;
    return `<div style="display:flex;gap:12px;margin:10px 0;align-items:flex-start">
      ${thumb}
      <div style="min-width:0">
        <div class="muted">${s.index}. ${esc(s.role)} · ${state}</div>
        <div style="font-weight:600;margin:3px 0">${esc(s.headline)}</div>
        ${s.body?`<div class="muted">${esc(s.body)}</div>`:''}
        ${(s.emphasis||[]).length?`<div class="muted" style="margin-top:3px">강조: ${s.emphasis.map(esc).join(' · ')}</div>`:''}
      </div>
    </div>`;
  }).join('');
  return `<div class="muted" style="margin-top:14px">캐러셀 슬라이드 (${slides.length}장)</div>${warn}${cards}`;
}

async function openPost(id){
  const p=await api('/posts/'+id);
  drawer.innerHTML=`<span class="x" onclick="drawer.classList.remove('open')">×</span>
    <h3>#${p.id} ${p.topic||''}</h3>
    <div class="muted">${p.platform} · ${p.pillar} · <span class="pill s-${p.status}">${p.status}</span>
      ${p.engagement_score!=null?` · 참여점수 <b class="${scoreClass(p.engagement_score)}">${p.engagement_score}</b>`:''}</div>
    ${p.chosen_hook?`<div style="margin-top:10px"><span class="muted">채택 훅</span><br>${p.chosen_hook}</div>`:''}
    <div class="cap">${(p.caption_ko||'').replace(/</g,'&lt;')}</div>
    ${p.cta?`<div class="muted">CTA</div><div>${p.cta}</div>`:''}
    ${(p.hook_variants||[]).length?`<div class="muted" style="margin-top:10px">훅 후보</div>${p.hook_variants.sort((a,b)=>b.predicted_score-a.predicted_score).map(h=>`<div style="margin:3px 0"><span class="score mid">[${h.predicted_score}]</span> <span class="muted">${h.technique}</span> ${h.text}</div>`).join('')}`:''}
    ${slidesHtml(p)}
    ${p.engagement_notes?`<div class="muted" style="margin-top:10px">개선 코멘트</div><div>${p.engagement_notes}</div>`:''}
    <div style="margin-top:16px">${['draft','review'].includes(p.status)?
      `<button class="act approve" onclick="act(${p.id},'approve')">승인</button><button class="act reject" onclick="act(${p.id},'reject')">거절</button>`:''}
      ${p.permalink?`<a class="act" href="${p.permalink}" target="_blank">발행 링크</a>`:''}</div>`;
  drawer.classList.add('open');
}
async function act(id,a){try{await post('/posts/'+id+'/'+a);drawer.classList.remove('open');tabs.queue();}catch(e){alert(e.message)}}
window.act=act;

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); tabs[b.dataset.tab]();
});
loadBrand(); tabs.overview();
</script>
