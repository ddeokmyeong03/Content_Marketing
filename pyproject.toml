[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "branding"
version = "0.1.0"
description = "Instagram & Threads 브랜딩 자동 관리 서비스"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "sqlite-utils>=3.35.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
branding = "branding.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/branding"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
